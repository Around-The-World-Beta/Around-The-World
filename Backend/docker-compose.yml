services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atw
      POSTGRES_PASSWORD: atw_dev_password
      POSTGRES_DB: around_the_world
    ports:
      - "5432:5432"
    volumes:
      - atw_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atw -d around_the_world"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atw_pg_data:
