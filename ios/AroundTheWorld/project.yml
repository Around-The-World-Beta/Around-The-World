# XcodeGen spec — regenerate with: brew install xcodegen && xcodegen
# Kept in sync so the shared scheme never drifts from the native target ID.
name: AroundTheWorld
options:
  bundleIdPrefix: com.aroundtheworld
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  AroundTheWorld:
    type: application
    platform: iOS
    sources:
      - path: AroundTheWorld
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aroundtheworld.app
        INFOPLIST_FILE: AroundTheWorld/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Around the World
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        API_BASE_URL: http://127.0.0.1:8081
        SUPABASE_URL: ""
        SUPABASE_ANON_KEY: ""
        GOOGLE_PLACES_API_KEY: ""
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
    scheme:
      testTargets: []
